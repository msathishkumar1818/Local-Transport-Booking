<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="arGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#FFC400"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
    <linearGradient id="arDark" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <filter id="arGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFC400" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Rounded Squircle Shield -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#arDark)" stroke="url(#arGrad)" stroke-width="2.2" filter="url(#arGlow)"/>

  <!-- High-Precision Aerodynamic Auto-Rickshaw Silhouette -->
  <!-- Canopy Roof (Curved aerodynamic roof) -->
  <path d="M10 17C10 15 11.5 13.5 13.5 13.5H26.5C28.2 13.5 29.8 14.5 30.5 16L35.5 26.5C35.8 27.2 36 27.8 36 28.5V32C36 32.8 35.3 33.5 34.5 33.5H32" 
        stroke="url(#arGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Driver Windshield & Front Cowl -->
  <path d="M25 15.5L29.5 25H34.5" stroke="#FFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Passenger Cabin Divider & Body Contour -->
  <path d="M10 23.5H23" stroke="url(#arGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M17 14.5V33.5" stroke="url(#arGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M10 31H12" stroke="url(#arGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rear Wheel (Dual suspension feel) -->
  <circle cx="15.5" cy="33.5" r="4" fill="#141414" stroke="url(#arGrad)" stroke-width="2.4"/>
  <circle cx="15.5" cy="33.5" r="1.5" fill="#FFC400"/>

  <!-- Front Wheel (Classic Auto Rickshaw single front wheel geometry) -->
  <circle cx="30" cy="33.5" r="4" fill="#141414" stroke="url(#arGrad)" stroke-width="2.4"/>
  <circle cx="30" cy="33.5" r="1.5" fill="#FFC400"/>

  <!-- Electric Energy Pulse / Lightning Arrow across side -->
  <path d="M22 20.5L20 25H25L23.5 29.5" stroke="#FFD54F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
